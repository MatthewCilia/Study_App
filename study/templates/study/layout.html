{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}StudyLog{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'study/styles.css' %}">
</head>

<body style="background-color: #FFD1DC;">

    <nav class="navbar navbar-expand-lg" style="background-color: #FFF380;">
        <div class="container">
            <a class="navbar-brand">StudyLog</a>

            <a class="navbar-brand" href="{% url 'dashboard' %}">Dashboard</a>

            {% if not user.is_authenticated %}
            <a class="navbar-brand" href="{% url 'login' %}">Login</a>

            <a class="navbar-brand" href="{% url 'register' %}">Register</a>
            {% endif %}

            {% if user.is_authenticated %}
            <a class="navbar-brand" href="{% url 'subjects' %}">Subjects</a>

            <a class="navbar-brand" href="{% url 'sessions' %}">Sessions</a>

            <a class="navbar-brand" href="{% url 'logout' %}">Logout</a>
            {% endif %}
        </div>
    </nav>

    <main class="container mt-4" style="background-color: #FFD1DC;">
        {% block body %}
        {% endblock %}
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
