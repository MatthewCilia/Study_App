{% extends "study/layout.html" %}

{% block title %}Subjects{% endblock %}

{% block body %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Subjects</h1>

    <a href="{% url 'subjects_new' %}" class="btn btn-pastel-yellow">
        Add New Subject
    </a>
</div>

<div class="row">
    {% for subject in subjects %}
        <div class="col-md-6 col-lg-4 mb-3">
            <div class="card h-100">
                <div class="card-body">

                    <h5 class="card-title">
                        {{ subject.name }}
                    </h5>

                    <p class="card-text">
                        {{ subject.description }}
                    </p>

                    <a href="{% url 'subjects_edit' subject.id %}"
                       class="btn btn-sm btn-outline-primary">
                        Edit
                    </a>

                    <a href="{% url 'subjects_delete' subject.id %}"
                       class="btn btn-sm btn-outline-danger">
                        Delete
                    </a>

                </div>
            </div>
        </div>

    {% empty %}
        <p>No subjects yet. Add your first subject.</p>
    {% endfor %}
</div>

{% endblock %}
